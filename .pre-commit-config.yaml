---
exclude: '^getting-started/.*'
repos:
 - repo: https://github.com/astral-sh/ruff-pre-commit
   rev: 2700fd5671c633760d912769c041bfcde2b9a01b  # frozen: v0.15.22
   hooks:
     - id: ruff-check
       types_or: [ python, pyi, jupyter ]
       args: [ --fix ]
     - id: ruff-format
       types_or: [ python, pyi, jupyter ]
 - repo: https://github.com/pre-commit/pre-commit-hooks
   rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
   hooks:
    - id: check-case-conflict
    - id: check-executables-have-shebangs
    - id: check-json
    - id: check-shebang-scripts-are-executable
    - id: check-symlinks
    - id: check-yaml
    - id: detect-aws-credentials
      args: ['--allow-missing-credentials']
    - id: detect-private-key
    - id: end-of-file-fixer
    - id: trailing-whitespace
 - repo: https://github.com/lycheeverse/lychee
   rev: af73b4e02731e0ff3a678b56769704d689138279  # frozen: nightly
   hooks:
     - id: lychee-docker
       # Keep all other configs in the config file
       args: ["--config", ".github/linters/lychee.toml"]
       types: [markdown]
 - repo: https://github.com/rhysd/actionlint
   rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
   hooks:
     - id: actionlint-docker
 - repo: https://github.com/koalaman/shellcheck-precommit
   rev: 99470f5e12208ff0fb17ab81c3c494f7620a1d8d  # frozen: v0.11.0
   hooks:
     - id: shellcheck
       args: [ -x, --source-path=SCRIPTDIR ]
 - repo: https://github.com/trufflesecurity/trufflehog
   rev: 27b0417c16317ca9a472a9a8092acce143b49c55  # frozen: v3.95.9
   hooks:
     - id: trufflehog
       # Check the past 2 commits; it's useful to make this go further back than main when running this where main and HEAD are equal
       entry: trufflehog git file://. --since-commit main~1 --no-verification --fail
 - repo: https://github.com/python-openapi/openapi-spec-validator
   rev: bd494d8889b709cc7169c1f879b790dade8b3ca4  # frozen: 0.9.0
   hooks:
    - id: openapi-spec-validator
 - repo: https://github.com/streetsidesoftware/cspell-cli
   rev: ea11f9efc0bec520073405bc30552da887ba71bc  # frozen: v10.0.1
   hooks:
     - id: cspell
       types: [markdown]
       args:
         - --no-must-find-files
         - --config
         - .github/linters/cspell.config.js
         - --no-progress
         - --no-summary
         - --gitignore
         - --files # this needs to be the last argument so that the paths are passed correctly.
